<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外科專科考題練習</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <!-- ===== 起始畫面 ===== -->
  <div id="start-screen" class="screen">
    <div class="card start-card">
      <h1>外科專科考題練習</h1>
      <p class="subtitle">共 <span id="total-count">0</span> 題，涵蓋 <span id="spec-count">0</span> 個科別</p>

      <div class="filter-section">
        <label>選擇科別</label>
        <div id="specialty-list" class="chip-group"></div>
      </div>

      <div class="filter-section">
        <label>題型</label>
        <div class="chip-group">
          <button class="chip active" data-type="all">全部</button>
          <button class="chip" data-type="單選題">單選題</button>
          <button class="chip" data-type="複選題">複選題</button>
        </div>
      </div>

      <div class="filter-section">
        <label>模式</label>
        <div class="chip-group">
          <button class="chip active" data-mode="practice" id="mode-practice">練習模式</button>
          <button class="chip" data-mode="exam" id="mode-exam">考試模式</button>
          <button class="chip" data-mode="standard-exam" id="mode-standard-exam">標準考試模式</button>
        </div>
        <p id="exam-mode-hint" class="info-text hidden" style="margin-top:6px;color:#b45309;"></p>
      </div>

      <div id="exam-name-section" class="filter-section hidden">
        <label>考生姓名（排行榜顯示用）</label>
        <div class="name-input-row">
          <input type="text" id="exam-player-name" class="name-input" placeholder="請輸入姓名（最多 20 字）" maxlength="20" autocomplete="off">
        </div>
        <p id="name-error" class="info-text hidden" style="color:#dc2626;"></p>
      </div>

      <div id="practice-options">
        <div class="filter-section">
          <label>題數上限</label>
          <div class="range-row">
            <input type="range" id="question-limit" min="5" max="250" value="25" step="5">
            <span id="limit-display">25</span> 題
          </div>
        </div>

        <div class="filter-section">
          <label>
            <input type="checkbox" id="shuffle-toggle" checked> 隨機排序
          </label>
        </div>
      </div>

      <button id="start-btn" class="btn-primary" disabled>開始作答</button>
      <p id="selected-info" class="info-text">請至少選擇一個科別</p>
    </div>
  </div>

  <!-- ===== 答題畫面 ===== -->
  <div id="quiz-screen" class="screen hidden">
    <div class="topbar">
      <div class="progress-info">
        <span id="progress-text">1 / 25</span>
        <span id="score-text">正確 0 / 已答 0</span>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="card quiz-card">
      <div class="question-meta">
        <span class="badge" id="q-specialty"></span>
        <span class="badge" id="q-type"></span>
        <span class="badge dim" id="q-number"></span>
        <span class="badge dim" id="q-source"></span>
      </div>

      <div id="question-images" class="question-images"></div>

      <p id="question-text" class="question-text"></p>

      <div id="options-container" class="options-container"></div>

      <div id="answer-feedback" class="feedback hidden"></div>

      <div class="button-row">
        <button id="submit-btn" class="btn-primary" disabled>確認答案</button>
        <button id="next-btn" class="btn-primary hidden">下一題</button>
      </div>
    </div>
  </div>

  <!-- ===== 結算畫面 ===== -->
  <div id="result-screen" class="screen hidden">
    <div class="card result-card">
      <h2>測驗結果</h2>
      <div class="score-circle">
        <span id="final-score">0%</span>
      </div>
      <p id="result-summary"></p>

      <div id="exam-stats" class="hidden">
        <div class="exam-stats-grid"></div>
      </div>

      <div id="result-details" class="result-details"></div>

      <div id="score-table-container" class="score-table-wrap"></div>

      <div id="leaderboard-section" class="hidden">
        <h3 style="margin-top:24px;margin-bottom:4px;">排行榜 Top 10</h3>
        <p class="info-text" style="margin-top:0;margin-bottom:12px;">排行榜僅計入標準全科考試模式成績</p>
        <div id="leaderboard-status"></div>
        <div id="leaderboard-container"></div>
      </div>

      <div class="button-row">
        <button id="review-btn" class="btn-secondary">查看錯題</button>
        <button id="restart-btn" class="btn-primary">重新開始</button>
      </div>
    </div>

    <div id="review-section" class="hidden">
      <h3>錯題回顧</h3>
      <div id="review-container"></div>
    </div>
  </div>

  <footer class="site-footer">Urology, NDMU M115 Yu-Yuan Chang</footer>

  <script src="script.js"></script>
</body>
</html>
